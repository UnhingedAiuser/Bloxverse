<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlockVerse Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
        body { margin: 0; background: #020617; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { backdrop-filter: blur(20px); background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); }
        .lua-editor { font-family: 'JetBrains Mono', monospace; background: #0f172a; color: #38bdf8; }
        .card-hover:active { transform: scale(0.98); transition: 0.2s; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDWGA4LelpAKz-o7rYLpOd7Gjz_qa5RA50",
            authDomain: "bloxverse-89800.firebaseapp.com",
            projectId: "bloxverse-89800",
            storageBucket: "bloxverse-89800.firebasestorage.app",
            messagingSenderId: "82457717231",
            appId: "1:82457717231:web:cdbfb0f42a890958eeee1a"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const { useState, useEffect } = React;

        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [tab, setTab] = useState('HOME'); // HOME, GAMES, SHOP, CREATE
            const [games, setGames] = useState([]);
            const [items, setItems] = useState([]);
            const [loading, setLoading] = useState(false);

            // Auth & Data Sync
            useEffect(() => {
                const unsubAuth = auth.onAuthStateChanged(async (u) => {
                    if (u) {
                        setUser(u);
                        const pRef = db.collection('profiles').doc(u.uid);
                        pRef.onSnapshot(snap => setProfile(snap.data()));
                    } else { setUser(null); }
                });

                const unsubGames = db.collection('artifacts/blockverse/public/data/games')
                    .onSnapshot(s => setGames(s.docs.map(d => ({id: d.id, ...d.data()}))));

                const unsubShop = db.collection('artifacts/blockverse/public/data/shop')
                    .onSnapshot(s => setItems(s.docs.map(d => ({id: d.id, ...d.data()}))));

                return () => { unsubAuth(); unsubGames(); unsubShop(); };
            }, []);

            // --- CREATE SYSTEM ---
            const uploadClothing = async (url, price, name) => {
                if (!profile?.isAdmin && profile?.coins < 200) return alert("Need 200 coins!");
                setLoading(true);
                try {
                    await db.collection('artifacts/blockverse/public/data/shop').add({
                        name, url, price: parseInt(price), 
                        creator: profile.username, creatorId: user.uid,
                        type: 'clothing', createdAt: Date.now()
                    });
                    if (!profile?.isAdmin) {
                        await db.collection('profiles').doc(user.uid).update({ coins: profile.coins - 200 });
                    }
                    setTab('SHOP');
                } catch(e) { console.error(e); }
                setLoading(false);
            };

            const uploadGame = async (name, luaCode) => {
                setLoading(true);
                await db.collection('artifacts/blockverse/public/data/games').add({
                    name, code: luaCode, creator: profile.username, plays: 0
                });
                setLoading(false);
                setTab('HOME');
            };

            if (!user) return <AuthScreen config={firebaseConfig} />;

            return (
                <div className="min-h-screen flex flex-col pb-24">
                    {/* Header */}
                    <header className="p-6 flex justify-between items-center bg-slate-950/50 sticky top-0 z-50 glass">
                        <div>
                            <h1 className="text-xl font-black italic tracking-tighter">BLOCK<span className="text-blue-500">VERSE</span></h1>
                            <p className="text-[10px] text-slate-500 font-bold uppercase">{tab}</p>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="bg-blue-600/20 px-3 py-1 rounded-full border border-blue-500/30 text-xs font-black text-blue-400">
                                {profile?.coins.toLocaleString()} ¢
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <nav className="fixed bottom-0 left-0 right-0 h-20 bg-slate-950 border-t border-white/10 flex justify-around items-center z-50 glass px-4">
                        <NavBtn active={tab==='HOME'} icon="🏠" label="Home" onClick={()=>setTab('HOME')} />
                        <NavBtn active={tab==='SHOP'} icon="👕" label="Shop" onClick={()=>setTab('SHOP')} />
                        <NavBtn active={tab==='CREATE'} icon="➕" label="Create" onClick={()=>setTab('CREATE')} />
                    </nav>

                    <main className="p-6">
                        {tab === 'HOME' && <HomeView profile={profile} games={games} items={items} />}
                        {tab === 'SHOP' && <ShopView items={items} profile={profile} user={user} db={db} />}
                        {tab === 'CREATE' && <CreateView onUploadClothing={uploadClothing} onUploadGame={uploadGame} loading={loading} profile={profile} />}
                    </main>
                </div>
            );
        }

        // --- SUB-COMPONENTS ---

        const NavBtn = ({active, icon, label, onClick}) => (
            <button onClick={onClick} className={`flex flex-col items-center justify-center gap-1 transition-all ${active ? 'text-blue-500 scale-110' : 'text-slate-500 opacity-60'}`}>
                <span className="text-xl">{icon}</span>
                <span className="text-[10px] font-black uppercase tracking-widest">{label}</span>
            </button>
        );

        const HomeView = ({profile, games, items}) => (
            <div className="space-y-8 animate-in fade-in duration-500">
                <section>
                    <h3 className="text-xs font-black text-slate-500 uppercase tracking-widest mb-4">New Games</h3>
                    <div className="flex gap-4 overflow-x-auto pb-4 scroll-hide">
                        {games.map(g => (
                            <div key={g.id} className="min-w-[140px] glass p-4 rounded-3xl card-hover">
                                <div className="aspect-square bg-slate-800 rounded-2xl mb-3 flex items-center justify-center text-3xl italic font-black text-white/10">GAME</div>
                                <p className="font-black text-sm truncate">{g.name}</p>
                                <p className="text-[8px] text-slate-500 uppercase font-bold">By {g.creator}</p>
                            </div>
                        ))}
                    </div>
                </section>

                <section>
                    <h3 className="text-xs font-black text-slate-500 uppercase tracking-widest mb-4">Global Creators</h3>
                    <div className="grid grid-cols-2 gap-4">
                        {items.slice(0,4).map(i => (
                            <div key={i.id} className="glass p-3 rounded-2xl flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center text-xs">👤</div>
                                <div>
                                    <p className="text-[10px] font-black truncate">{i.creator}</p>
                                    <p className="text-[8px] text-blue-400 font-bold uppercase">Designer</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            </div>
        );

        const ShopView = ({items, profile, user, db}) => {
            const buy = async (item) => {
                if (profile.coins < item.price) return alert("Not enough coins!");
                await db.collection('profiles').doc(user.uid).update({
                    coins: profile.coins - item.price,
                    inventory: firebase.firestore.FieldValue.arrayUnion(item.url)
                });
                alert("Purchased!");
            };

            return (
                <div className="grid grid-cols-2 gap-4">
                    {items.map(i => (
                        <div key={i.id} className="glass p-4 rounded-[2rem] flex flex-col items-center">
                            <div className="w-full aspect-square rounded-2xl bg-white/5 mb-3 overflow-hidden border border-white/5 relative">
                                <img src={i.url} className="w-full h-full object-cover" alt="item" />
                                <div className="absolute top-2 right-2 bg-black/60 px-2 py-1 rounded-lg text-[8px] font-black">{i.price} ¢</div>
                            </div>
                            <h4 className="font-black text-xs text-center mb-1">{i.name}</h4>
                            <p className="text-[8px] text-slate-500 mb-3 font-bold uppercase tracking-tighter">By {i.creator}</p>
                            <button onClick={()=>buy(i)} className="w-full py-2 bg-blue-600 rounded-xl text-[10px] font-black uppercase tracking-widest">Buy</button>
                        </div>
                    ))}
                </div>
            );
        };

        const CreateView = ({onUploadClothing, onUploadGame, loading, profile}) => {
            const [mode, setMode] = useState('CLOTHING');
            const [url, setUrl] = useState('');
            const [name, setName] = useState('');
            const [price, setPrice] = useState(50);
            const [lua, setLua] = useState('-- Sample Lua\nfunction onStart()\n  print("Hello World")\nend');

            return (
                <div className="space-y-6">
                    <div className="flex gap-2">
                        <button onClick={()=>setMode('CLOTHING')} className={`flex-1 py-3 rounded-2xl font-black text-xs ${mode==='CLOTHING' ? 'bg-blue-600' : 'bg-white/5'}`}>CLOTHING</button>
                        <button onClick={()=>setMode('GAME')} className={`flex-1 py-3 rounded-2xl font-black text-xs ${mode==='GAME' ? 'bg-blue-600' : 'bg-white/5'}`}>GAME MAKER</button>
                    </div>

                    {mode === 'CLOTHING' ? (
                        <div className="glass p-6 rounded-[2rem] space-y-4">
                            <h3 className="font-black italic">UPLOAD DESIGN</h3>
                            <input className="w-full p-4 bg-white/5 rounded-xl border border-white/5 text-xs font-bold" placeholder="Asset URL (imgur/discord link)" value={url} onChange={e=>setUrl(e.target.value)} />
                            <input className="w-full p-4 bg-white/5 rounded-xl border border-white/5 text-xs font-bold" placeholder="Item Name" value={name} onChange={e=>setName(e.target.value)} />
                            <input className="w-full p-4 bg-white/5 rounded-xl border border-white/5 text-xs font-bold" type="number" placeholder="Set Price (¢)" value={price} onChange={e=>setPrice(e.target.value)} />
                            <div className="bg-blue-500/10 p-4 rounded-xl text-[10px] font-bold text-blue-400">
                                ⚡ LISTING COST: {profile?.isAdmin ? 'FREE' : '200 COINS'}
                            </div>
                            <button disabled={loading} onClick={()=>onUploadClothing(url, price, name)} className="w-full bg-blue-600 p-4 rounded-xl font-black uppercase tracking-widest">{loading ? 'UPLOADING...' : 'POST TO SHOP'}</button>
                        </div>
                    ) : (
                        <div className="glass p-6 rounded-[2rem] space-y-4">
                            <h3 className="font-black italic">BLOCKLUA STUDIO</h3>
                            <input className="w-full p-4 bg-white/5 rounded-xl border border-white/5 text-xs font-bold" placeholder="Game Name" value={name} onChange={e=>setName(e.target.value)} />
                            <textarea className="w-full h-48 lua-editor p-4 rounded-xl border border-white/10 text-xs font-bold" value={lua} onChange={e=>setLua(e.target.value)} />
                            <button disabled={loading} onClick={()=>onUploadGame(name, lua)} className="w-full bg-blue-600 p-4 rounded-xl font-black uppercase tracking-widest">PUBLISH GAME</button>
                        </div>
                    )}
                </div>
            );
        };

        const AuthScreen = ({config}) => {
            const [m, setM] = useState('LOGIN');
            const [e, setE] = useState('');
            const [p, setP] = useState('');
            const [u, setU] = useState('');
            const [err, setErr] = useState('');

            const act = async () => {
                try {
                    if (m === 'SIGNUP') {
                        const c = await auth.createUserWithEmailAndPassword(e, p);
                        const isAdm = u === 'Bloxverse';
                        await db.collection('profiles').doc(c.user.uid).set({ 
                            username: u, coins: isAdm ? 1000000 : 500, isAdmin: isAdm, inventory: [] 
                        });
                    } else await auth.signInWithEmailAndPassword(e, p);
                } catch(x) { setErr(x.message); }
            };

            return (
                <div className="h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass p-8 rounded-[2.5rem] w-full max-w-sm border border-white/10">
                        <h1 className="text-3xl font-black italic mb-8 text-center">BLOCK<span className="text-blue-500">VERSE</span></h1>
                        <div className="space-y-3">
                            {m==='SIGNUP' && <input className="w-full p-4 bg-white/5 rounded-2xl text-xs font-bold" placeholder="Username" onChange={x=>setU(x.target.value)}/>}
                            <input className="w-full p-4 bg-white/5 rounded-2xl text-xs font-bold" placeholder="Email" onChange={x=>setE(x.target.value)}/>
                            <input className="w-full p-4 bg-white/5 rounded-2xl text-xs font-bold" type="password" placeholder="Password" onChange={x=>setP(x.target.value)}/>
                            {err && <p className="text-red-400 text-[8px] uppercase font-black text-center">{err}</p>}
                            <button onClick={act} className="w-full bg-blue-600 p-5 rounded-2xl font-black shadow-lg">CONTINUE</button>
                            <button onClick={()=>setM(m==='LOGIN'?'SIGNUP':'LOGIN')} className="w-full text-slate-500 text-[8px] font-black uppercase">{m==='LOGIN'?'Register Account':'Back to Login'}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
