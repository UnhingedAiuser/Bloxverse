<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlockVerse Metaverse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { margin: 0; background: #020617; color: white; font-family: 'Inter', sans-serif; overflow: hidden; touch-action: manipulation; }
        canvas { display: block; background: #0f172a; width: 100vw; height: 100vh; }
        .glass { backdrop-filter: blur(16px); background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); }
        input::placeholder { color: #64748b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. CONFIGURATION (REPLACE WITH YOUR FIREBASE KEYS) ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        auth.languageCode = 'en'; // Force English

        const { useState, useEffect, useRef } = React;

        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [view, setView] = useState('LOADING'); 
            const [authMode, setAuthMode] = useState('LOGIN');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [username, setUsername] = useState('');
            const [error, setError] = useState('');
            
            // Auth State Listener
            useEffect(() => {
                return auth.onAuthStateChanged(async (u) => {
                    if (u) {
                        const snap = await db.collection('profiles').doc(u.uid).get();
                        if (snap.exists) {
                            setProfile(snap.data());
                            setView('HOME');
                        } else { setView('AUTH'); }
                        setUser(u);
                    } else { setView('AUTH'); setUser(null); }
                });
            }, []);

            const handleAuth = async () => {
                setError('');
                try {
                    if (authMode === 'SIGNUP') {
                        const cred = await auth.createUserWithEmailAndPassword(email, password);
                        const data = { 
                            username, email, coins: 500, 
                            inventory: [], isAdmin: username.toLowerCase() === 'bloxverse' 
                        };
                        await db.collection('profiles').doc(cred.user.uid).set(data);
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                } catch (err) { setError(err.message); }
            };

            if (view === 'LOADING') return <div className="h-screen flex items-center justify-center font-black text-blue-500">BOOTING BLOCKVERSE...</div>;

            if (view === 'AUTH') return (
                <div className="h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass p-10 rounded-[2.5rem] w-full max-w-md shadow-2xl">
                        <h1 className="text-4xl font-black italic mb-2 tracking-tighter">BLOCK<span className="text-blue-500">VERSE</span></h1>
                        <p className="text-slate-500 text-sm mb-8 font-bold uppercase tracking-widest">Global Protocol Loaded</p>
                        
                        <div className="space-y-4">
                            {authMode === 'SIGNUP' && (
                                <input className="w-full p-4 bg-white/5 rounded-2xl border border-white/10 outline-none focus:ring-2 ring-blue-500" placeholder="Username" value={username} onChange={e => setUsername(e.target.value)} />
                            )}
                            <input className="w-full p-4 bg-white/5 rounded-2xl border border-white/10 outline-none focus:ring-2 ring-blue-500" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} />
                            <input className="w-full p-4 bg-white/5 rounded-2xl border border-white/10 outline-none focus:ring-2 ring-blue-500" type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} />
                            
                            {error && <p className="text-red-400 text-xs font-bold">{error}</p>}

                            <button onClick={handleAuth} className="w-full bg-blue-600 p-4 rounded-2xl font-black shadow-lg hover:bg-blue-500 transition-all">
                                {authMode === 'LOGIN' ? 'ENTER SYSTEM' : 'INITIALIZE ACCOUNT'}
                            </button>

                            <button onClick={() => setAuthMode(authMode === 'LOGIN' ? 'SIGNUP' : 'LOGIN')} className="w-full text-slate-500 text-xs font-bold mt-4">
                                {authMode === 'LOGIN' ? "Protocol: Create New User" : "Protocol: Login Existing"}
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="h-screen flex flex-col">
                    <header className="p-6 flex justify-between items-center border-b border-white/5">
                        <h1 className="font-black italic text-xl">BLOCK<span className="text-blue-500">VERSE</span></h1>
                        <div className="flex items-center gap-4">
                            <span className="bg-blue-600/20 text-blue-400 px-4 py-2 rounded-xl text-xs font-black border border-blue-500/20">{profile?.coins} ¢</span>
                            <button onClick={() => auth.signOut()} className="text-slate-500 text-xs font-bold">LOGOUT</button>
                        </div>
                    </header>
                    <main className="flex-1 flex flex-col items-center justify-center p-10 text-center">
                        <h2 className="text-5xl font-black mb-4">Welcome, {profile?.username}</h2>
                        <p className="text-slate-400 max-w-sm mb-10">Your account is fully synced and ready for the metaverse.</p>
                        <button className="bg-blue-600 px-12 py-5 rounded-3xl font-black text-xl shadow-2xl shadow-blue-500/20 active:scale-95 transition-all">
                            ENTER PLAZA
                        </button>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
