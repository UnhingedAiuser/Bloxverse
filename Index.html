<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bloxverse 2D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { margin: 0; background: #111216; color: #e2e8f0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDWGA4LelpAKz-o7rYLpOd7Gjz_qa5RA50",
            authDomain: "bloxverse-89800.firebaseapp.com",
            projectId: "bloxverse-89800",
            storageBucket: "bloxverse-89800.firebasestorage.app",
            messagingSenderId: "82457717231",
            appId: "1:82457717231:web:cdbfb0f42a890958eeee1a"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const { useState, useEffect } = React;

        // --- COMPONENTS ---

        const AvatarPreview = ({ avatar }) => {
            return (
                <div className="relative w-48 h-64 bg-slate-800 rounded-xl border border-[#393b45] shadow-inner flex items-center justify-center shrink-0 overflow-hidden">
                    <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PHBhdGggZD0iTTAgMGgyMHYyMEgwem0xMCAwaDEwdjEwSDEwem0wIDEwaDEwdjEwSDEwIiBmaWxsPSIjMWUxZjI2IiBmaWxsLW9wYWNpdHk9IjAuMSIgLz48L3N2Zz4=')] bg-[length:16px_16px]"></div>
                    {/* Base Body SVG */}
                    <svg viewBox="0 0 100 150" className="absolute w-full h-full z-0" fill="#cbd5e1">
                        <rect x="35" y="20" width="30" height="30" rx="4" /> {/* Head */}
                        <rect x="25" y="55" width="50" height="50" rx="2" /> {/* Torso */}
                        <rect x="5" y="55" width="15" height="50" rx="2" />  {/* Left Arm */}
                        <rect x="80" y="55" width="15" height="50" rx="2" /> {/* Right Arm */}
                        <rect x="25" y="110" width="22" height="40" rx="2" /> {/* Left Leg */}
                        <rect x="53" y="110" width="22" height="40" rx="2" /> {/* Right Leg */}
                    </svg>
                    
                    {/* Item Layers */}
                    {avatar?.face?.url && <img src={avatar.face.url} className="absolute w-full h-full object-contain z-10 pointer-events-none drop-shadow-sm" />}
                    {avatar?.shirt?.url && <img src={avatar.shirt.url} className="absolute w-full h-full object-contain z-20 pointer-events-none drop-shadow-md" />}
                    {avatar?.pants?.url && <img src={avatar.pants.url} className="absolute w-full h-full object-contain z-20 pointer-events-none drop-shadow-md" />}
                    {avatar?.accessory?.url && <img src={avatar.accessory.url} className="absolute w-full h-full object-contain z-30 pointer-events-none drop-shadow-lg" />}
                    {avatar?.hat?.url && <img src={avatar.hat.url} className="absolute w-full h-full object-contain z-40 pointer-events-none drop-shadow-xl" />}
                </div>
            );
        };

        const TopNav = ({ profile, setTab, tab, onLogout }) => (
            <header className="bg-[#1b1c23] border-b border-[#393b45] px-6 py-3 flex justify-between items-center shrink-0 h-16 shadow-md z-10">
                <div className="flex items-center gap-10">
                    <h1 className="text-2xl font-black text-white tracking-tighter cursor-pointer" onClick={() => setTab('DISCOVER')}>BLOX<span className="text-blue-500">VERSE</span></h1>
                    <nav className="flex gap-8">
                        {['DISCOVER', 'AVATAR', 'SHOP', 'CREATE'].map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`font-bold text-[13px] tracking-wide transition-all ${tab === t ? 'text-white border-b-2 border-white pb-1' : 'text-slate-400 hover:text-white'}`}>
                                {t.charAt(0) + t.slice(1).toLowerCase()}
                            </button>
                        ))}
                    </nav>
                </div>
                <div className="flex items-center gap-6">
                    <div className="flex items-center gap-2 bg-[#111216] px-4 py-1.5 rounded-lg border border-[#393b45] shadow-inner">
                        <span className="text-green-500 font-black text-sm">¢</span>
                        <span className="font-bold text-sm text-white tracking-wide">{profile.coins?.toLocaleString() || 0}</span>
                    </div>
                    <div className="flex items-center gap-4">
                        <span className="font-bold text-sm text-slate-300">{profile.username}</span>
                        <button onClick={onLogout} className="text-[11px] font-bold text-slate-500 hover:text-white uppercase tracking-wider bg-[#23252d] px-3 py-1.5 rounded border border-[#393b45] transition-colors">Logout</button>
                    </div>
                </div>
            </header>
        );

        const AuthScreen = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [username, setUsername] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        const res = await auth.createUserWithEmailAndPassword(email, password);
                        await db.collection('profiles').doc(res.user.uid).set({
                            username,
                            coins: 500,
                            inventory: [],
                            avatar: { face: null, shirt: null, pants: null, hat: null, accessory: null }
                        });
                    }
                } catch (err) {
                    setError(err.message);
                }
                setLoading(false);
            };

            return (
                <div className="h-screen bg-[#111216] flex flex-col items-center justify-center p-4 relative overflow-hidden">
                    <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PHBhdGggZD0iTTAgMGgyMHYyMEgwem0xMCAwaDEwdjEwSDEwem0wIDEwaDEwdjEwSDEwIiBmaWxsPSIjMWUxZjI2IiBmaWxsLW9wYWNpdHk9IjAuNSIgLz48L3N2Zz4=')] bg-[length:24px_24px] z-0"></div>
                    <div className="absolute w-[800px] h-[800px] bg-blue-600/10 rounded-full blur-[120px] -top-96 -left-96 pointer-events-none"></div>
                    
                    <div className="bg-[#1b1c23] p-10 rounded-2xl shadow-2xl w-full max-w-md border border-[#393b45] z-10 backdrop-blur-sm">
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-black text-white tracking-tighter italic">BLOX<span className="text-blue-500">VERSE</span></h1>
                            <p className="text-xs font-bold text-slate-500 tracking-widest uppercase mt-2">2D Experience</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            {!isLogin && (
                                <div>
                                    <label className="block text-[10px] font-black text-slate-400 mb-1.5 uppercase tracking-widest">Username</label>
                                    <input required value={username} onChange={e=>setUsername(e.target.value)} className="w-full bg-[#111216] text-white border border-[#393b45] rounded-xl p-3.5 text-sm font-bold focus:outline-none focus:border-blue-500 transition-colors shadow-inner" placeholder="Your display name" />
                                </div>
                            )}
                            <div>
                                <label className="block text-[10px] font-black text-slate-400 mb-1.5 uppercase tracking-widest">Email</label>
                                <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} className="w-full bg-[#111216] text-white border border-[#393b45] rounded-xl p-3.5 text-sm font-bold focus:outline-none focus:border-blue-500 transition-colors shadow-inner" placeholder="you@example.com" />
                            </div>
                            <div>
                                <label className="block text-[10px] font-black text-slate-400 mb-1.5 uppercase tracking-widest">Password</label>
                                <input type="password" required value={password} onChange={e=>setPassword(e.target.value)} className="w-full bg-[#111216] text-white border border-[#393b45] rounded-xl p-3.5 text-sm font-bold focus:outline-none focus:border-blue-500 transition-colors shadow-inner" placeholder="••••••••" />
                            </div>
                            {error && <div className="bg-red-900/20 border border-red-900/50 p-3 rounded-xl"><p className="text-red-400 text-xs font-bold text-center">{error}</p></div>}
                            <button disabled={loading} type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl transition-all shadow-lg shadow-blue-900/20 active:scale-[0.98] uppercase tracking-widest text-xs">
                                {loading ? 'Processing...' : (isLogin ? 'Log In' : 'Sign Up')}
                            </button>
                        </form>
                        <button onClick={() => {setIsLogin(!isLogin); setError('');}} className="w-full text-center text-xs font-bold text-slate-500 mt-6 hover:text-white transition-colors">
                            {isLogin ? "Need an account? Sign Up" : "Already have an account? Log In"}
                        </button>
                    </div>
                </div>
            );
        };

        const DiscoverTab = ({ onPlay }) => {
            const [games, setGames] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsub = db.collection('games').orderBy('createdAt', 'desc').onSnapshot(s => {
                    setGames(s.docs.map(d => ({ id: d.id, ...d.data() })));
                    setLoading(false);
                });
                return unsub;
            }, []);

            return (
                <div className="max-w-7xl mx-auto h-full flex flex-col">
                    <div className="mb-8 shrink-0">
                        <h2 className="text-3xl font-black text-white mb-2 tracking-tight">Discover</h2>
                        <p className="text-slate-400 text-sm font-bold">Play millions of 2D experiences created by the community.</p>
                    </div>
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center"><p className="text-slate-500 font-bold animate-pulse">Loading experiences...</p></div>
                    ) : (
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 auto-rows-max overflow-y-auto pb-20 pr-2 hide-scroll">
                            {games.map(game => (
                                <div key={game.id} onClick={() => onPlay(game)} className="bg-[#1b1c23] border border-[#393b45] rounded-2xl overflow-hidden cursor-pointer hover:-translate-y-1 hover:border-slate-400 hover:shadow-xl hover:shadow-black/50 transition-all duration-200 group flex flex-col">
                                    <div className="aspect-square bg-slate-800 flex items-center justify-center relative overflow-hidden">
                                        <div className="absolute inset-0 bg-gradient-to-t from-[#1b1c23] to-transparent z-10"></div>
                                        <span className="text-6xl z-0 group-hover:scale-110 transition-transform duration-300 drop-shadow-lg">🎮</span>
                                        <div className="absolute top-3 right-3 bg-black/60 backdrop-blur px-2.5 py-1 rounded-md z-20 flex items-center gap-1.5">
                                            <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                            <span className="text-[10px] font-black text-white">PLAY</span>
                                        </div>
                                    </div>
                                    <div className="p-4 flex-1 flex flex-col relative z-20 -mt-8 bg-[#1b1c23] rounded-t-2xl">
                                        <h3 className="text-[15px] font-black text-white truncate mb-1" title={game.name}>{game.name}</h3>
                                        <p className="text-[11px] font-bold text-slate-400 truncate mb-3">By {game.creator}</p>
                                        <div className="mt-auto flex items-center justify-between border-t border-[#393b45] pt-3">
                                            <div className="flex items-center gap-1.5 text-xs font-bold text-slate-400">
                                                <span className="text-slate-500">▶️</span>
                                                <span>{game.visits || 0}</span>
                                            </div>
                                            <button className="bg-white text-black px-4 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest opacity-0 group-hover:opacity-100 transition-opacity">Play</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const AvatarTab = ({ profile, user }) => {
            const [inventory, setInventory] = useState([]);
            const [avatar, setAvatar] = useState(profile.avatar || {});
            const [category, setCategory] = useState('All');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!profile.inventory || profile.inventory.length === 0) {
                    setLoading(false);
                    return;
                }
                const fetchInv = async () => {
                    const shopSnapshot = await db.collection('shop').get();
                    const allShopItems = shopSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    const userItems = allShopItems.filter(item => profile.inventory.includes(item.id));
                    setInventory(userItems);
                    setLoading(false);
                };
                fetchInv();
            }, [profile.inventory]);

            const toggleEquip = async (item) => {
                const typeKey = item.type.toLowerCase(); // 'hat', 'shirt', 'pants', 'face', 'accessory'
                const newAvatar = { ...avatar };
                
                if (newAvatar[typeKey]?.id === item.id) {
                    delete newAvatar[typeKey]; // Unequip
                } else {
                    newAvatar[typeKey] = { id: item.id, url: item.url }; // Equip
                }
                
                setAvatar(newAvatar);
                await db.collection('profiles').doc(user.uid).update({ avatar: newAvatar });
            };

            const categories = ['All', 'Hat', 'Shirt', 'Pants', 'Face', 'Accessory'];
            const filteredInv = category === 'All' ? inventory : inventory.filter(i => i.type === category);

            return (
                <div className="max-w-6xl mx-auto h-full flex gap-8">
                    {/* Left Column: Avatar Preview */}
                    <div className="w-72 shrink-0 flex flex-col gap-6">
                        <div className="bg-[#1b1c23] p-6 rounded-2xl border border-[#393b45] shadow-lg flex flex-col items-center relative overflow-hidden">
                            <div className="absolute top-0 w-full h-32 bg-gradient-to-b from-blue-600/20 to-transparent"></div>
                            <h2 className="text-lg font-black text-white mb-6 tracking-tight relative z-10 w-full text-center">Avatar Editor</h2>
                            <div className="relative z-10">
                                <AvatarPreview avatar={avatar} />
                            </div>
                            <div className="mt-6 w-full grid grid-cols-2 gap-2 text-center">
                                <div className="bg-[#111216] p-2 rounded-lg border border-[#393b45]">
                                    <p className="text-[10px] font-black text-slate-500 uppercase">Items Owned</p>
                                    <p className="text-sm font-bold text-white mt-1">{inventory.length}</p>
                                </div>
                                <div className="bg-[#111216] p-2 rounded-lg border border-[#393b45]">
                                    <p className="text-[10px] font-black text-slate-500 uppercase">Equipped</p>
                                    <p className="text-sm font-bold text-white mt-1">{Object.keys(avatar).length}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Right Column: Inventory Grid */}
                    <div className="flex-1 bg-[#1b1c23] rounded-2xl border border-[#393b45] flex flex-col overflow-hidden shadow-lg">
                        <div className="flex border-b border-[#393b45] bg-[#111216] overflow-x-auto hide-scroll shrink-0">
                            {categories.map(c => (
                                <button key={c} onClick={() => setCategory(c)} className={`px-6 py-4 text-xs font-black uppercase tracking-widest whitespace-nowrap transition-colors relative ${category === c ? 'text-white' : 'text-slate-500 hover:text-slate-300 hover:bg-white/5'}`}>
                                    {c}
                                    {category === c && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.8)]"></div>}
                                </button>
                            ))}
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 hide-scroll">
                            {loading ? (
                                <div className="flex h-full items-center justify-center"><p className="text-slate-500 font-bold animate-pulse">Loading inventory...</p></div>
                            ) : (
                                <div className="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 auto-rows-max">
                                    {filteredInv.map(item => {
                                        const isEquipped = avatar[item.type.toLowerCase()]?.id === item.id;
                                        return (
                                            <div key={item.id} onClick={() => toggleEquip(item)} className={`relative bg-[#111216] rounded-xl p-3 cursor-pointer transition-all hover:-translate-y-1 hover:shadow-lg hover:shadow-black/50 group flex flex-col border-2 ${isEquipped ? 'border-green-500 shadow-[0_0_15px_rgba(34,197,94,0.2)]' : 'border-[#393b45] hover:border-slate-500'}`}>
                                                {isEquipped && <div className="absolute -top-2 -right-2 bg-green-500 text-white text-[9px] font-black px-2 py-1 rounded-md shadow-lg z-20 tracking-wider uppercase">Equipped</div>}
                                                <div className="aspect-square bg-slate-800 rounded-lg mb-3 overflow-hidden flex items-center justify-center relative shadow-inner">
                                                    <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPjxwYXRoIGQ9Ik0wIDBoOHY4SDB6bTQgMGg0djRINFptMCA0aDR2NEg0IiBmaWxsPSIjMWUxZjI2IiBmaWxsLW9wYWNpdHk9IjAuNSIgLz48L3N2Zz4=')] bg-[length:8px_8px] z-0"></div>
                                                    <img src={item.url} className="w-[80%] h-[80%] object-contain relative z-10 group-hover:scale-110 transition-transform duration-300 drop-shadow-md" />
                                                </div>
                                                <p className="text-xs text-white font-bold truncate text-center mt-auto" title={item.name}>{item.name}</p>
                                            </div>
                                        )
                                    })}
                                    {filteredInv.length === 0 && <div className="col-span-full h-64 flex flex-col items-center justify-center text-slate-500"><span className="text-4xl mb-4">👕</span><p className="text-sm font-bold">No {category !== 'All' ? category.toLowerCase() + 's' : 'items'} found.</p><button onClick={() => document.querySelector('nav button:nth-child(3)').click()} className="mt-4 text-blue-400 text-xs font-bold hover:underline">Browse the Shop</button></div>}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ShopTab = ({ profile, user }) => {
            const [items, setItems] = useState([]);
            const [category, setCategory] = useState('All');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsub = db.collection('shop').orderBy('createdAt', 'desc').onSnapshot(s => {
                    setItems(s.docs.map(d => ({ id: d.id, ...d.data() })));
                    setLoading(false);
                });
                return unsub;
            }, []);

            const buyItem = async (item) => {
                if (profile.inventory?.includes(item.id)) return alert("You already own this item.");
                if (profile.coins < item.price) return alert("Not enough coins! Sell items or create games to earn more.");
                
                const confirmBuy = window.confirm(`Purchase ${item.name} for ${item.price} coins?`);
                if (!confirmBuy) return;

                try {
                    await db.collection('profiles').doc(user.uid).update({
                        coins: firebase.firestore.FieldValue.increment(-item.price),
                        inventory: firebase.firestore.FieldValue.arrayUnion(item.id)
                    });
                    alert("Item purchased successfully! You can equip it in the Avatar tab.");
                } catch (err) {
                    alert("Purchase failed: " + err.message);
                }
            };

            const categories = ['All', 'Hat', 'Shirt', 'Pants', 'Face', 'Accessory'];
            const filteredItems = category === 'All' ? items : items.filter(i => i.type === category);

            return (
                <div className="max-w-7xl mx-auto h-full flex flex-col bg-[#1b1c23] rounded-2xl border border-[#393b45] overflow-hidden shadow-xl">
                    <div className="flex border-b border-[#393b45] bg-[#111216] px-2 shrink-0 overflow-x-auto hide-scroll">
                        {categories.map(c => (
                            <button key={c} onClick={() => setCategory(c)} className={`px-6 py-5 text-[11px] font-black uppercase tracking-widest whitespace-nowrap transition-colors relative ${category === c ? 'text-white' : 'text-slate-500 hover:text-slate-300 hover:bg-white/5'}`}>
                                {c}
                                {category === c && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.8)]"></div>}
                            </button>
                        ))}
                    </div>
                    <div className="p-8 overflow-y-auto flex-1 hide-scroll relative">
                        {loading ? (
                            <div className="flex h-full items-center justify-center"><p className="text-slate-500 font-bold animate-pulse">Loading catalog...</p></div>
                        ) : (
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6 auto-rows-max pb-20">
                                {filteredItems.map(item => {
                                    const owns = profile.inventory?.includes(item.id);
                                    const cantAfford = !owns && profile.coins < item.price;
                                    return (
                                        <div key={item.id} className="bg-[#111216] border border-[#393b45] rounded-2xl overflow-hidden flex flex-col group hover:-translate-y-1 hover:border-slate-400 hover:shadow-xl hover:shadow-black/50 transition-all duration-200">
                                            <div className="aspect-square bg-slate-800 p-4 relative flex items-center justify-center shadow-inner">
                                                <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPjxwYXRoIGQ9Ik0wIDBoOHY4SDB6bTQgMGg0djRINFptMCA0aDR2NEg0IiBmaWxsPSIjMWUxZjI2IiBmaWxsLW9wYWNpdHk9IjAuNSIgLz48L3N2Zz4=')] bg-[length:8px_8px] z-0"></div>
                                                <img src={item.url} className="w-full h-full object-contain relative z-10 group-hover:scale-110 transition-transform duration-300 drop-shadow-lg" />
                                                {owns && <div className="absolute top-3 right-3 bg-slate-900/80 backdrop-blur border border-[#393b45] text-slate-300 text-[9px] font-black px-2 py-1 rounded-md z-20 tracking-wider shadow-lg">OWNED</div>}
                                            </div>
                                            <div className="p-4 flex-1 flex flex-col">
                                                <h3 className="text-[13px] font-black text-white truncate mb-1" title={item.name}>{item.name}</h3>
                                                <p className="text-[10px] font-bold text-slate-500 mb-4 truncate uppercase tracking-wider">By {item.creator}</p>
                                                <div className="mt-auto flex items-center justify-between">
                                                    <div className={`flex items-center gap-1.5 font-black text-sm ${cantAfford ? 'text-red-400' : 'text-green-500'}`}>
                                                        <span>¢</span>
                                                        <span>{item.price}</span>
                                                    </div>
                                                    <button 
                                                        onClick={() => buyItem(item)} 
                                                        disabled={owns || cantAfford}
                                                        className={`px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all ${owns ? 'bg-[#23252d] text-slate-500 border border-[#393b45] cursor-not-allowed' : cantAfford ? 'bg-red-900/20 text-red-500 border border-red-900/50 cursor-not-allowed' : 'bg-white text-black hover:bg-slate-200 active:scale-95 shadow-md'}`}
                                                    >
                                                        {owns ? 'Owned' : 'Buy'}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                                {filteredItems.length === 0 && <div className="col-span-full h-64 flex flex-col items-center justify-center text-slate-500"><span className="text-4xl mb-4">🛒</span><p className="text-sm font-bold">No items found in this category.</p></div>}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const CreateTab = ({ profile, user }) => {
            const [subTab, setSubTab] = useState('ITEM'); // ITEM, GAME
            const [name, setName] = useState('');
            const [type, setType] = useState('Shirt');
            const [url, setUrl] = useState('');
            const [price, setPrice] = useState(10);
            const [loading, setLoading] = useState(false);

            const [gameName, setGameName] = useState('');
            const [gameDesc, setGameDesc] = useState('');

            const handleCreateItem = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    await db.collection('shop').add({
                        name,
                        type,
                        url,
                        price: parseInt(price) || 0,
                        creator: profile.username,
                        creatorId: user.uid,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert("Item successfully published to the Avatar Shop!");
                    setName(''); setUrl(''); setPrice(10);
                } catch (err) {
                    alert(err.message);
                }
                setLoading(false);
            };

            const handleCreateGame = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    await db.collection('games').add({
                        name: gameName,
                        description: gameDesc,
                        creator: profile.username,
                        creatorId: user.uid,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        objects: [],
                        visits: 0
                    });
                    alert("Game created! Go to Discover to play and build it in Edit Mode.");
                    setGameName(''); setGameDesc('');
                } catch (err) {
                    alert(err.message);
                }
                setLoading(false);
            };

            return (
                <div className="max-w-4xl mx-auto h-full flex flex-col items-center justify-center pb-20">
                    <div className="bg-[#1b1c23] border border-[#393b45] rounded-3xl overflow-hidden shadow-2xl w-full">
                        <div className="flex border-b border-[#393b45] bg-[#111216]">
                            <button onClick={() => setSubTab('ITEM')} className={`flex-1 py-5 text-xs font-black uppercase tracking-widest transition-colors relative ${subTab === 'ITEM' ? 'text-white bg-[#1b1c23]' : 'text-slate-500 hover:text-slate-300 hover:bg-white/5'}`}>
                                Create Avatar Item
                                {subTab === 'ITEM' && <div className="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>}
                            </button>
                            <button onClick={() => setSubTab('GAME')} className={`flex-1 py-5 text-xs font-black uppercase tracking-widest transition-colors relative ${subTab === 'GAME' ? 'text-white bg-[#1b1c23]' : 'text-slate-500 hover:text-slate-300 hover:bg-white/5'}`}>
                                Create Experience
                                {subTab === 'GAME' && <div className="absolute top-0 left-0 w-full h-1 bg-green-500"></div>}
                            </button>
                        </div>
                        
                        <div className="p-10">
                            {subTab === 'ITEM' ? (
                                <form onSubmit={handleCreateItem} className="space-y-6 max-w-lg mx-auto">
                                    <div className="text-center mb-8">
                                        <h2 className="text-2xl font-black text-white tracking-tight">Design Clothing & Assets</h2>
                                        <p className="text-xs font-bold text-slate-500 mt-2">Publish your creations to the Avatar Shop and earn coins.</p>
                                    </div>
                                    <div className="bg-blue-900/10 border border-blue-900/30 p-4 rounded-xl flex gap-4 items-start shadow-inner">
                                        <span className="text-xl">💡</span>
                                        <div>
                                            <p className="text-xs font-bold text-blue-400 uppercase tracking-wider mb-1">Asset Guidelines</p>
                                            <p className="text-xs font-medium text-slate-400 leading-relaxed">Provide a direct image URL (e.g., Imgur). Images must have transparent backgrounds to layer correctly on the 2D avatar base.</p>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="col-span-2">
                                            <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Item Name</label>
                                            <input required value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Vintage Denim Jacket" className="w-full bg-[#111216] text-white border border-[#393b45] rounded-xl p-3.5 text-sm font-bold focus:outline-none focus:border-blue-500 transition-colors shadow-inner" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Asset Type</label>
                                            <select value={type} onChange={e=>setType(e.target.value)} className="w-full bg-[#111216] text-white border border-[#393b45] rounded-xl p-3.5 text-sm font-bold focus:outline-none focus:border-blue-500 transition-colors shadow-inner appearance-none">
                                                <option value="Hat">Hat</option>
                                                <option value="Shirt">Shirt</option>
                                                <option value="Pants">Pants</option>
                                                <option value="Face">Face</option>
                                                <option value="Accessory">Accessory</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Price (Coins)</label>
                                            <input required type="number" min="0" max="99999" value={price} onChange={e=>setPrice(e.target.value)} className="w-full bg-[#111216] text-white border border-[#393b45] rounded-xl p-3.5 text-sm font-bold focus:outline-none focus:border-blue-500 transition-colors shadow-inner" />
                                        </div>
                                        <div className="col-span-2">
                                            <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Image URL</label>
                                            <input required type="url" value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://i.imgur.com/yourimage.png" className="w-full bg-[#111216] text-white border border-[#393b45] rounded-xl p-3.5 text-sm font-bold focus:outline-none focus:border-blue-500 transition-colors shadow-inner" />
                                        </div>
                                    </div>
                                    <button disabled={loading} type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl transition-all mt-8 uppercase tracking-widest text-xs shadow-lg shadow-blue-900/20 active:scale-[0.98]">
                                        {loading ? 'Publishing...' : 'Publish to Shop'}
                                    </button>
                                </form>
                            ) : (
                                <form onSubmit={handleCreateGame} className="space-y-6 max-w-lg mx-auto">
                                    <div className="text-center mb-8">
                                        <h2 className="text-2xl font-black text-white tracking-tight">Create 2D Experience</h2>
                                        <p className="text-xs font-bold text-slate-500 mt-2">Build a new world. Edit it instantly by playing it.</p>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Experience Title</label>
                                        <input required value={gameName} onChange={e=>setGameName(e.target.value)} placeholder="e.g. Escape the 2D Obby!" className="w-full bg-[#111216] text-white border border-[#393b45] rounded-xl p-3.5 text-sm font-bold focus:outline-none focus:border-green-500 transition-colors shadow-inner" />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Description</label>
                                        <textarea value={gameDesc} onChange={e=>setGameDesc(e.target.value)} placeholder="Tell players what this experience is about..." rows="4" className="w-full bg-[#111216] text-white border border-[#393b45] rounded-xl p-3.5 text-sm font-bold focus:outline-none focus:border-green-500 transition-colors shadow-inner resize-none"></textarea>
                                    </div>
                                    <button disabled={loading} type="submit" className="w-full bg-green-600 hover:bg-green-500 text-white font-black py-4 rounded-xl transition-all mt-8 uppercase tracking-widest text-xs shadow-lg shadow-green-900/20 active:scale-[0.98]">
                                        {loading ? 'Creating...' : 'Create Experience'}
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const GameClient = ({ game, onExit, profile }) => {
            const isCreator = game.creator === profile.username;
            const [playerPos, setPlayerPos] = useState({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
            const [objects, setObjects] = useState(game.objects || []);
            const [isEditMode, setIsEditMode] = useState(false);
            const [saving, setSaving] = useState(false);

            useEffect(() => {
                // Increment visits silently
                db.collection('games').doc(game.id).update({ visits: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
            }, [game.id]);

            // Simple Physics & Movement
            useEffect(() => {
                if (isEditMode) return;
                
                const keys = {};
                let animationFrameId;
                const speed = 5;

                const handleKeyDown = (e) => { keys[e.key.toLowerCase()] = true; };
                const handleKeyUp = (e) => { keys[e.key.toLowerCase()] = false; };

                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);

                const update = () => {
                    setPlayerPos(prev => {
                        let nx = prev.x;
                        let ny = prev.y;
                        if (keys['arrowup'] || keys['w']) ny -= speed;
                        if (keys['arrowdown'] || keys['s']) ny += speed;
                        if (keys['arrowleft'] || keys['a']) nx -= speed;
                        if (keys['arrowright'] || keys['d']) nx += speed;

                        // Basic collision with window bounds
                        nx = Math.max(24, Math.min(window.innerWidth - 24, nx));
                        ny = Math.max(32 + 64, Math.min(window.innerHeight - 32, ny)); // 64 is top bar height

                        return { x: nx, y: ny };
                    });
                    animationFrameId = requestAnimationFrame(update);
                };

                update();

                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                    cancelAnimationFrame(animationFrameId);
                };
            }, [isEditMode]);

            const saveMap = async () => {
                setSaving(true);
                try {
                    await db.collection('games').doc(game.id).update({ objects });
                    // alert("Experience saved successfully!");
                } catch(e) { alert(e.message); }
                setSaving(false);
            };

            const addBlock = () => {
                setObjects([...objects, { id: Date.now(), x: window.innerWidth/2, y: window.innerHeight/2, w: 100, h: 20, color: '#3b82f6', type: 'solid' }]);
            };

            return (
                <div className="fixed inset-0 bg-[#0f172a] z-50 flex flex-col overflow-hidden">
                    {/* Game World Background Grid */}
                    <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHBhdGggZD0iTTAgMGg0MHY0MEgwek0yMCAwaDIwdjIwSDIwek0wIDIwaDIwdjIwSDB6IiBmaWxsPSIjMWUxZjI2IiBmaWxsLW9wYWNpdHk9IjAuNSIgLz48L3N2Zz4=')] bg-[length:40px_40px] z-0 pointer-events-none"></div>

                    {/* Game HUD / Header */}
                    <header className="h-16 bg-[#1b1c23]/90 backdrop-blur-md border-b border-[#393b45] flex items-center justify-between px-6 shrink-0 text-white z-50 shadow-md">
                        <div className="flex items-center gap-6">
                            <button onClick={onExit} className="w-10 h-10 bg-[#111216] border border-[#393b45] rounded-xl flex items-center justify-center hover:bg-white hover:text-black transition-colors shadow-inner group">
                                <span className="text-xl font-bold group-hover:-translate-x-1 transition-transform">←</span>
                            </button>
                            <div>
                                <h2 className="text-base font-black tracking-tight">{game.name}</h2>
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">By {game.creator}</p>
                            </div>
                        </div>
                        {isCreator && (
                            <div className="flex gap-3 bg-[#111216] p-1.5 rounded-xl border border-[#393b45] shadow-inner">
                                <button onClick={() => setIsEditMode(!isEditMode)} className={`px-4 py-2 text-[10px] font-black uppercase tracking-widest rounded-lg transition-colors shadow-md ${isEditMode ? 'bg-blue-600 text-white' : 'bg-[#23252d] text-slate-400 hover:text-white border border-[#393b45]'}`}>
                                    {isEditMode ? 'Play Mode' : 'Studio Mode'}
                                </button>
                                {isEditMode && (
                                    <>
                                        <div className="w-px bg-[#393b45] my-1"></div>
                                        <button onClick={addBlock} className="px-4 py-2 text-[10px] font-black uppercase tracking-widest rounded-lg bg-green-600 hover:bg-green-500 text-white transition-colors shadow-md">Add Part</button>
                                        <button onClick={saveMap} disabled={saving} className="px-4 py-2 text-[10px] font-black uppercase tracking-widest rounded-lg bg-purple-600 hover:bg-purple-500 text-white transition-colors shadow-md">{saving ? 'Saving...' : 'Save'}</button>
                                    </>
                                )}
                            </div>
                        )}
                    </header>
                    
                    {/* Game Client Viewport */}
                    <main className="flex-1 relative overflow-hidden z-10">
                        
                        {/* Render Objects (Parts) */}
                        {objects.map((obj, i) => (
                            <div 
                                key={obj.id} 
                                style={{ left: obj.x, top: obj.y, width: obj.w, height: obj.h, backgroundColor: obj.color }}
                                className={`absolute rounded-sm shadow-lg shadow-black/50 ${isEditMode ? 'cursor-move ring-2 ring-white/50 ring-offset-2 ring-offset-[#0f172a]' : ''}`}
                                onMouseDown={(e) => {
                                    if (!isEditMode) return;
                                    const startX = e.clientX;
                                    const startY = e.clientY;
                                    const initialX = obj.x;
                                    const initialY = obj.y;

                                    const onMouseMove = (moveEvent) => {
                                        const dx = moveEvent.clientX - startX;
                                        const dy = moveEvent.clientY - startY;
                                        const newObjs = [...objects];
                                        newObjs[i] = { ...obj, x: initialX + dx, y: initialY + dy };
                                        setObjects(newObjs);
                                    };

                                    const onMouseUp = () => {
                                        document.removeEventListener('mousemove', onMouseMove);
                                        document.removeEventListener('mouseup', onMouseUp);
                                    };

                                    document.addEventListener('mousemove', onMouseMove);
                                    document.addEventListener('mouseup', onMouseUp);
                                }}
                            >
                                {isEditMode && (
                                    <div className="absolute -top-8 left-1/2 -translate-x-1/2 flex gap-1 bg-black/80 p-1 rounded backdrop-blur border border-white/20 opacity-0 hover:opacity-100 transition-opacity" onMouseDown={e=>e.stopPropagation()}>
                                        <button onClick={() => {
                                            const newObjs=[...objects];
                                            newObjs[i].w += 10;
                                            setObjects(newObjs);
                                        }} className="w-5 h-5 bg-[#393b45] rounded text-white text-[10px] flex items-center justify-center font-bold">W+</button>
                                        <button onClick={() => {
                                            const newObjs=[...objects];
                                            newObjs[i].h += 10;
                                            setObjects(newObjs);
                                        }} className="w-5 h-5 bg-[#393b45] rounded text-white text-[10px] flex items-center justify-center font-bold">H+</button>
                                        <button onClick={() => setObjects(objects.filter(o => o.id !== obj.id))} className="w-5 h-5 bg-red-600 rounded text-white text-[10px] flex items-center justify-center font-bold">X</button>
                                    </div>
                                )}
                            </div>
                        ))}

                        {/* Player Character */}
                        <div 
                            style={{ left: playerPos.x, top: playerPos.y, transform: 'translate(-50%, -100%)' }}
                            className="absolute z-40 transition-none"
                        >
                            {/* Player Nameplate */}
                            <div className="absolute -top-6 left-1/2 -translate-x-1/2 bg-black/60 backdrop-blur-sm px-2.5 py-1 rounded-md border border-white/10 shadow-lg pointer-events-none">
                                <span className="text-white text-[10px] font-black tracking-widest uppercase whitespace-nowrap">{profile.username}</span>
                            </div>
                            
                            {/* Render miniaturized Avatar Preview */}
                            <div className="w-[48px] h-[64px] relative origin-bottom drop-shadow-2xl">
                                <div className="absolute inset-0" style={{ transform: 'scale(0.25)', transformOrigin: 'top left', width: '192px', height: '256px' }}>
                                    <AvatarPreview avatar={profile.avatar || {}} />
                                </div>
                            </div>
                        </div>
                        
                        {/* Instructions overlay if play mode */}
                        {!isEditMode && (
                            <div className="absolute bottom-6 left-6 bg-black/40 backdrop-blur p-4 rounded-xl border border-white/10 text-white pointer-events-none">
                                <p className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">Controls</p>
                                <div className="flex gap-2 font-bold text-xs">
                                    <kbd className="bg-[#111216] border border-[#393b45] px-2 py-1 rounded shadow-inner">W</kbd>
                                    <kbd className="bg-[#111216] border border-[#393b45] px-2 py-1 rounded shadow-inner">A</kbd>
                                    <kbd className="bg-[#111216] border border-[#393b45] px-2 py-1 rounded shadow-inner">S</kbd>
                                    <kbd className="bg-[#111216] border border-[#393b45] px-2 py-1 rounded shadow-inner">D</kbd>
                                    <span className="ml-2 text-slate-400">to move</span>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        };

        // --- MAIN APP ---

        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [tab, setTab] = useState('DISCOVER'); // DISCOVER, AVATAR, SHOP, CREATE
            const [playingGame, setPlayingGame] = useState(null);
            const [authChecked, setAuthChecked] = useState(false);

            useEffect(() => {
                return auth.onAuthStateChanged(u => {
                    setAuthChecked(true);
                    if (u) {
                        setUser(u);
                        db.collection('profiles').doc(u.uid).onSnapshot(s => {
                            if (s.exists) setProfile({ id: s.id, ...s.data() });
                        });
                    } else {
                        setUser(null);
                        setProfile(null);
                    }
                });
            }, []);

            if (!authChecked) return <div className="h-screen bg-[#111216] flex items-center justify-center"><div className="w-12 h-12 border-4 border-[#393b45] border-t-blue-500 rounded-full animate-spin"></div></div>;
            if (!user) return <AuthScreen />;
            if (!profile) return <div className="h-screen bg-[#111216] flex items-center justify-center"><p className="text-slate-500 font-bold animate-pulse uppercase tracking-widest text-xs">Loading Profile...</p></div>;

            if (playingGame) {
                return <GameClient game={playingGame} onExit={() => setPlayingGame(null)} profile={profile} />;
            }

            return (
                <div className="h-screen bg-[#111216] text-slate-200 flex flex-col overflow-hidden">
                    <TopNav profile={profile} setTab={setTab} tab={tab} onLogout={() => auth.signOut()} />
                    <main className="flex-1 overflow-y-auto bg-[#0f1218] p-6 lg:p-8 hide-scroll relative z-0">
                        {/* Subtle background glow */}
                        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-blue-600/5 rounded-full blur-[100px] pointer-events-none -z-10"></div>
                        
                        <div className="h-full max-w-7xl mx-auto animate-in fade-in duration-500">
                            {tab === 'DISCOVER' && <DiscoverTab onPlay={setPlayingGame} />}
                            {tab === 'AVATAR' && <AvatarTab profile={profile} user={user} />}
                            {tab === 'SHOP' && <ShopTab profile={profile} user={user} />}
                            {tab === 'CREATE' && <CreateTab profile={profile} user={user} />}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
